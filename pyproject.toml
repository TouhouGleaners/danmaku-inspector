[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-inspector"
dynamic = ["version"]
description = "B站多分P弹幕错发/漏发校验工具"
requires-python = ">=3.12"
authors = [
    { name = "Miku_oso", email = "mikuoso@qq.com" }
]
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "protobuf>=4.21.0",
    "platformdirs>=4.5.1",
    "keyring>=25.7.0",
    "cryptography>=46.0.3",
    "pydantic>=2.12.5",
]

[project.scripts]
dmi = "danmaku_inspector.main:main"

[tool.setuptools.dynamic]
version = {attr = "danmaku_inspector._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
