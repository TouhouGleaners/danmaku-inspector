[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-inspector"
version = "0.1.0"
description = "B站多分P弹幕错发/漏发校验工具"
requires-python = ">=3.12"
authors = [
    { name = "Miku_oso", email = "mikuoso@qq.com" }
]
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "protobuf>=4.21.0",
]

[project.scripts]
dmi = "danmaku_inspector.main:main"

[tool.setuptools.packages.find]
where = ["src"]
